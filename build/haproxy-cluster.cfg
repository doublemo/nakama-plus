global
    log stdout format raw local0

defaults
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server inter 2s fall 2 rise 1

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

listen http_api
    bind :7350
    mode http
    balance roundrobin
    option forwardfor
    option httpchk GET /healthcheck
    http-check expect status 200
    timeout tunnel 1h
    server nakama-1 nakama-1:7350 check resolvers docker init-addr last,none
    server nakama-2 nakama-2:7350 check resolvers docker init-addr last,none
    server nakama-3 nakama-3:7350 check resolvers docker init-addr last,none

listen grpc_api
    bind :7349
    mode tcp
    balance leastconn
    timeout client 1h
    timeout server 1h
    server nakama-1 nakama-1:7349 check resolvers docker init-addr last,none
    server nakama-2 nakama-2:7349 check resolvers docker init-addr last,none
    server nakama-3 nakama-3:7349 check resolvers docker init-addr last,none
